<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a14"/>
      <stop offset="50%" stop-color="#0b1528"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#22d3ee" stroke-opacity="0.3" stroke-width="8"/>

  <!-- Subtle glow layer behind shield -->
  <circle cx="256" cy="256" r="160" fill="url(#glowGrad)" filter="url(#glow)"/>

  <!-- Outer Shield contour -->
  <path d="M 256 96 L 384 152 C 384 272 328 356 256 408 C 184 356 128 272 128 152 Z" 
        fill="#040d1a" stroke="url(#shieldGrad)" stroke-width="16" stroke-linejoin="round"/>

  <!-- Inner stylized 'D' + Cybersecurity Checkmark/Core -->
  <!-- Left upright bar -->
  <rect x="196" y="184" width="28" height="144" rx="14" fill="url(#shieldGrad)"/>

  <!-- Modern 'D' loop + Cyber nodes -->
  <path d="M 210 184 H 272 C 314 184 340 212 340 256 C 340 300 314 328 272 328 H 210" 
        fill="none" stroke="url(#shieldGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Cyber Node & Circuit accent -->
  <circle cx="256" cy="256" r="14" fill="#34d399"/>
  <circle cx="340" cy="256" r="8" fill="#22d3ee"/>
</svg>
